---
# Full test suite, gated on the ok-to-test PR label.
# Try: pact run --label ok-to-test
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: full-suite
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-label: "[ok-to-test]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
    - name: labels
      value: "{{ pull_request_labels }}"
    - name: sender
      value: "{{ sender }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: labels
      - name: sender
    tasks:
      - name: test
        params:
          - name: labels
            value: $(params.labels)
          - name: sender
            value: $(params.sender)
        taskSpec:
          params:
            - name: labels
            - name: sender
          workspaces:
            - name: source
          steps:
            - name: checkout-repo
              displayName: "Checkout Repository"
              ref:
                resolver: hub
                params:
                  - name: catalog
                    value: git-clone-stepaction
                  - name: type
                    value: artifact
                  - name: kind
                    value: stepaction
                  - name: name
                    value: git-clone
                  - name: version
                    value: "1.7.0"
              params:
                - name: output-path
                  value: $(workspaces.source.path)
                - name: url
                  value: "$(params.repo_url)"
                - name: revision
                  value: "$(params.revision)"
            - name: run
              image: docker.io/golang:1.27
              env:
                - name: GOCACHE
                  value: $(workspaces.source.path)/go-build-cache/cache
                - name: GOMODCACHE
                  value: $(workspaces.source.path)/go-build-cache/mod
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                echo "ok-to-test from $(params.sender) (labels: $(params.labels)): running the full suite"
                git config --global --add safe.directory "$(workspaces.source.path)"
                go test -v -race -count=1 ./...
    workspaces:
      - name: source
  workspaces:
    - name: source
      emptyDir: {}
