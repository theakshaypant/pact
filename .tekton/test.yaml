---
# PR unit tests (race detector) for Go, module and pipeline changes.
# Try: pact run
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: unit-tests
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[*]"
    pipelinesascode.tekton.dev/on-path-change: "[***/*.go, go.mod, go.sum, .tekton/*.yaml]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    tasks:
      - name: test
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: fetch-repo
              displayName: "Fetch Repository"
              ref:
                resolver: hub
                params:
                  - name: catalog
                    value: git-clone-stepaction
                  - name: type
                    value: artifact
                  - name: kind
                    value: stepaction
                  - name: name
                    value: git-clone
                  - name: version
                    value: "1.7.0"
              params:
                - name: output-path
                  value: $(workspaces.source.path)
                - name: url
                  value: "$(params.repo_url)"
                - name: revision
                  value: "$(params.revision)"
            - name: unit
              image: docker.io/golang:1.27
              env:
                - name: GOCACHE
                  value: $(workspaces.source.path)/go-build-cache/cache
                - name: GOMODCACHE
                  value: $(workspaces.source.path)/go-build-cache/mod
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                git config --global --add safe.directory "$(workspaces.source.path)"
                go test -race ./cmd/... ./pkg/...
    workspaces:
      - name: source
  workspaces:
    - name: source
      emptyDir: {}
