---
# Build and smoke-test the binary on push to main. The volumeClaimTemplate
# shares the workspace between the build and smoke task pods.
# Try: pact run --event push
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-and-smoke
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    tasks:
      - name: build
        taskSpec:
          workspaces:
            - name: source
          results:
            - name: binary
              description: path of the built pact binary
          steps:
            - name: clone-repo
              displayName: "Clone Repository"
              ref:
                resolver: hub
                params:
                  - name: catalog
                    value: git-clone-stepaction
                  - name: type
                    value: artifact
                  - name: kind
                    value: stepaction
                  - name: name
                    value: git-clone
                  - name: version
                    value: "1.7.0"
              params:
                - name: output-path
                  value: $(workspaces.source.path)
                - name: url
                  value: "$(params.repo_url)"
                - name: revision
                  value: "$(params.revision)"
            - name: compile
              image: docker.io/golang:1.27
              env:
                - name: GOCACHE
                  value: $(workspaces.source.path)/go-build-cache/cache
                - name: GOMODCACHE
                  value: $(workspaces.source.path)/go-build-cache/mod
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                git config --global --add safe.directory "$(workspaces.source.path)"
                go build -o bin/pact ./cmd/pact
                printf '%s' "$(workspaces.source.path)/bin/pact" > "$(results.binary.path)"
      - name: smoke
        runAfter: ["build"]
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: version
              image: docker.io/golang:1.27
              workingDir: $(workspaces.source.path)
              script: |
                #!/usr/bin/env bash
                set -euo pipefail
                "$(tasks.build.results.binary)" help > /dev/null
                echo "smoke test ok"
    finally:
      - name: epilogue
        taskSpec:
          steps:
            - name: summary
              image: docker.io/alpine:3.20
              script: echo "build pipeline finished (finally tasks run on success and failure alike)"
    workspaces:
      - name: source
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi
