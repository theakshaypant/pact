---
# Link-check markdown on PRs touching .md files. The workspace is named
# "repo" rather than "source" to show the single-workspace binding.
# Try: pact run
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: docs-links
  annotations:
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[***/*.md, *.md]"
spec:
  params:
    - name: repo_url
      value: "{{repo_url}}"
    - name: revision
      value: "{{revision}}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
    tasks:
      - name: check-links
        taskSpec:
          workspaces:
            - name: repo
          steps:
            - name: fetch-repository
              displayName: "Fetch Repository"
              ref:
                resolver: hub
                params:
                  - name: catalog
                    value: git-clone-stepaction
                  - name: type
                    value: artifact
                  - name: kind
                    value: stepaction
                  - name: name
                    value: git-clone
                  - name: version
                    value: "1.7.0"
              params:
                - name: output-path
                  value: $(workspaces.repo.path)
                - name: url
                  value: "$(params.repo_url)"
                - name: revision
                  value: "$(params.revision)"
            - name: check
              image: docker.io/alpine:3.20
              workingDir: $(workspaces.repo.path)
              script: |
                #!/bin/sh
                set -eu
                fail=0
                for doc in $(find . -name '*.md' -not -path './vendor/*'); do
                  echo "checking $doc"
                  for link in $(grep -oE '\]\([^) ]+\)' "$doc" | sed -e 's/^](//' -e 's/)$//' | grep -vE '^(https?:|mailto:|#)' || true); do
                    target=${link%%#*}
                    case "$target" in
                      ""|./*|../*) ;;
                      /*) continue ;;
                    esac
                    if [ ! -e "$(dirname "$doc")/$target" ]; then
                      echo "  broken link: $link"
                      fail=1
                    fi
                  done
                done
                if [ "$fail" -eq 0 ]; then echo "all local markdown links resolve"; fi
                exit "$fail"
    workspaces:
      - name: repo
  workspaces:
    - name: repo
      emptyDir: {}
