apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: cel-title
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: "body.pull_request.title == \"feat: add local testing\""
spec:
  pipelineSpec:
    tasks:
      - name: check
        taskSpec:
          steps:
            - name: run
              image: alpine:latest
              script: echo title matched
