apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: custom-params
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  params:
    - name: environment
      value: "{{ environment }}"
  pipelineSpec:
    params:
      - name: environment
      - name: greeting
    tasks:
      - name: check
        taskSpec:
          steps:
            - name: run
              image: alpine:latest
              script: echo "$(params.environment) $(params.greeting)"
