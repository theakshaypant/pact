apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pr-basic
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: check
        taskSpec:
          steps:
            - name: cat-readme
              image: alpine:latest
              script: cat README.md
