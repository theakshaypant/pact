# The CEL expression is syntactically invalid. PAC logs the evaluation
# error and skips the PipelineRun, so this file never matches.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: bad-cel
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == ((((
spec:
  pipelineSpec:
    tasks:
      - name: hello
        taskSpec:
          steps:
            - name: say
              image: alpine:3.20
              script: echo never
