apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: cel-go-files
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-cel-expression: "files.all.exists(f, f.endsWith('.go'))"
spec:
  pipelineSpec:
    tasks:
      - name: check
        taskSpec:
          steps:
            - name: run
              image: alpine:latest
              script: echo go files changed
