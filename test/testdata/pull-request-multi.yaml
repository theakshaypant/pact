apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pr-multi-first
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: first
        taskSpec:
          steps:
            - name: run
              image: alpine:latest
              script: echo first
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: pr-multi-second
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: second
        taskSpec:
          steps:
            - name: run
              image: alpine:latest
              script: echo second
