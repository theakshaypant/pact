# Two PipelineRuns in one file: only the first matches a pull_request
# event, only the second matches a push event.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: two-runs-pr
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: hello
        taskSpec:
          steps:
            - name: say
              image: alpine:3.20
              script: echo pr
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: two-runs-push
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: hello
        taskSpec:
          steps:
            - name: say
              image: alpine:3.20
              script: echo push
