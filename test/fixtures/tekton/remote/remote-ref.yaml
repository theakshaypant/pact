# References a task that is neither in this directory nor fetchable
# offline; resolving must fail with PAC's "cannot find referenced task"
# error.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: remote-ref
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
spec:
  pipelineSpec:
    tasks:
      - name: run-remote
        taskRef:
          name: not-present-anywhere
