apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: on-comment
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^/test"
spec:
  params:
    - name: comment
      value: "{{ trigger_comment }}"
  pipelineSpec:
    params:
      - name: comment
        type: string
    tasks:
      - name: hello
        taskSpec:
          params:
            - name: comment
              type: string
          steps:
            - name: say
              image: alpine:3.20
              script: echo $(params.comment)
