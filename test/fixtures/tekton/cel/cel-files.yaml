apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: cel-files
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && files.all.exists(f, f.endsWith(".go"))
spec:
  pipelineSpec:
    tasks:
      - name: hello
        taskSpec:
          steps:
            - name: say
              image: alpine:3.20
              script: echo go files matched
